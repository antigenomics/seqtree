<text x="56" y="386" font-size="24" fill="#eef2f7" font-weight="700">Reference collection</text>
<text x="56" y="420" font-size="17" fill="#9cadbf" font-weight="400">Amino-acid or nucleotide sequences</text>
<text x="56" y="447" font-size="17" fill="#9cadbf" font-weight="400">Caller-owned IDs and annotations</text>
<text x="446" y="386" font-size="24" fill="#eef2f7" font-weight="700">Immutable native index</text>
<text x="446" y="420" font-size="17" fill="#9cadbf" font-weight="400">Whole-sequence or substring search</text>
<text x="446" y="447" font-size="17" fill="#9cadbf" font-weight="400">Shared read-only reference state</text>
<text x="836" y="386" font-size="24" fill="#eef2f7" font-weight="700">One batch of queries</text>
<text x="836" y="420" font-size="17" fill="#9cadbf" font-weight="400">Hits, alignments and reductions</text>
<text x="836" y="447" font-size="17" fill="#9cadbf" font-weight="400">Automatic allocation-aware parallelism</text>
<path d="M56 483 H1144" fill="none" stroke="#354254" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="56" y="522" width="27" height="4" fill="#83b5e7" opacity="1"/>
<text x="56" y="566" font-size="23" fill="#eef2f7" font-weight="700">Indexed search</text>
<text x="56" y="603" font-size="16" fill="#9cadbf" font-weight="400">Bounded fuzzy matches and top hits.</text>
<text x="56" y="629" font-size="16" fill="#9cadbf" font-weight="400">TextIndex finds substrings in long records.</text>
<rect x="446" y="522" width="27" height="4" fill="#25c39d" opacity="1"/>
<text x="446" y="566" font-size="23" fill="#eef2f7" font-weight="700">Pairwise operations</text>
<text x="446" y="603" font-size="16" fill="#9cadbf" font-weight="400">Affine alignment and sequence distances.</text>
<text x="446" y="629" font-size="16" fill="#9cadbf" font-weight="400">Gap-block scoring and matrix reductions.</text>
<rect x="836" y="522" width="27" height="4" fill="#ffbd59" opacity="1"/>
<text x="836" y="566" font-size="23" fill="#eef2f7" font-weight="700">Composable outputs</text>
<text x="836" y="603" font-size="16" fill="#9cadbf" font-weight="400">Map ref_id back to your reference rows.</text>
<text x="836" y="629" font-size="16" fill="#9cadbf" font-weight="400">Biological interpretation stays downstream.</text>
<path d="M56 678 H1144" fill="none" stroke="#354254" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="56" y="719" font-size="17" fill="#9cadbf" font-weight="400">C++20 + Python API</text>
<text x="735" y="719" font-size="16" fill="#9cadbf" font-weight="400">Batch APIs · shared resources · automatic CPU budgets</text>
